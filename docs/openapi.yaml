openapi: 3.1.0
info:
  title: OnYou API
  version: 0.1.0
  description: |
    OnYou turns focus time into care for a virtual pet (PRD v2.9).
    All bodies are JSON with camelCase fields; timestamps are ISO 8601 UTC.
    Authentication is a JWT in the HttpOnly `onyou_auth` cookie. The JWT
    subject is the user id and the `tv` claim is tokenVersion. This document
    contains no secrets.
    A focus session belongs to the account. Any authenticated tab of the
    owner may heartbeat or request completion. Protected operations require
    that cookie. There is no focus-session token header.
    Shipped operations match a route on main: signup, login, start session,
    read the Active session, heartbeat, and complete.
    Planned operations have no route. Logout waits on issue #18.
    Password-reset request waits on issue #24. Password-reset confirm waits
    on issue #25. Reading the pet waits on issue #19. Renaming the pet waits
    on issue #10. Give up waits on issue #17. Those descriptions are plans,
    not shipped contracts.
    GET /api/sessions is not on main. The history route is issue #22, added
    in draft Pull request #56, including the history item fields. This document
    leaves that field list for a later revision so the two edits do not overlap.
servers:
  - url: /
security:
  - authCookie: []
tags:
  - name: Auth
    description: Account access. Password reset is not implemented.
  - name: Pet
    description: Pet read and rename. Neither route is implemented.
  - name: Sessions
    description: Account-owned focus sessions.
paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create an account and its default pet, Mochi
      x-implementation: shipped
      description: |
        Creates the user and the pet in one transaction and signs the user in.
        The email is trimmed and lowercased. A missing or unknown `timezone`
        is stored as `America/Los_Angeles`. The timezone cannot be changed later.
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AuthCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An account with this email already exists (case-insensitive).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: EMAIL_IN_USE
                  message: An account with this email already exists.
                  fields:
                    email: An account with this email already exists.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      x-implementation: shipped
      description: |
        Matches the email case-insensitively. A wrong email and a wrong
        password return the same 401 response.
      operationId: logIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AuthCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email or password is incorrect. Check both and try again.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      x-implementation: planned
      security:
        - authCookie: []
      description: |
        Not implemented. No route is registered (issue #18).
        Planned behavior, not a shipped contract: signing out stops
        heartbeats. Logging out during an Active session asks for
        confirmation, then abandons that session on every device.
        The request and response contract is documented when issue #18 merges.
      responses:
        "404":
          description: |
            Not implemented. The server has no logout route, so this path
            is not found.
  /api/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset
      x-implementation: planned
      security: []
      description: |
        Not implemented. No route is registered (issue #24).
        Planned behavior, not a shipped contract: the response is the same
        whether or not the email matches an account, and requests are rate
        limited. Setting the new password depends on issue #25. Request and
        response schemas are documented when those issues merge.
      responses:
        "404":
          description: |
            Not implemented. The server has no password-reset request route,
            so this path is not found. Missing documentation depends on
            issue #24 and issue #25.
  /api/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password
      x-implementation: planned
      security: []
      description: |
        Not implemented. No route is registered (issue #25).
        Planned behavior, not a shipped contract: a successful reset signs
        the account out everywhere by incrementing tokenVersion. It does not
        abandon an Active focus session by itself. The request body, success
        response, and error responses are documented when issue #25 merges.
      responses:
        "404":
          description: |
            Not implemented. The server has no password-reset confirm route,
            so this path is not found.
  /api/pet:
    get:
      tags: [Pet]
      operationId: getPet
      summary: Get the account pet
      x-implementation: planned
      security:
        - authCookie: []
      description: |
        Not implemented. No route is registered (issue #19).
        The feeding-progress response schema is not documented here. It is
        added when issue #19 merges. Signup still creates the default pet,
        Mochi, but this read is not a shipped endpoint.
      responses:
        "404":
          description: |
            Not implemented. The server has no pet route, so this path is
            not found. Missing documentation depends on issue #19.
    patch:
      tags: [Pet]
      operationId: updatePet
      summary: Rename the account pet
      x-implementation: planned
      security:
        - authCookie: []
      description: |
        Not implemented. No route is registered (issue #10).
        The rename request and response are documented when issue #10 merges.
        A blank name is planned to fall back to Mochi, and names over 30
        characters are planned to be rejected. That rule is not a shipped
        contract.
      responses:
        "404":
          description: |
            Not implemented. The server has no pet route, so this path is
            not found. Missing documentation depends on issue #10.
  /api/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List focus history
      description: >
        Returns the authenticated account's Completed and Abandoned sessions,
        newest first, 20 per page.
      parameters:
        - $ref: "#/components/parameters/HistoryCursor"
        - $ref: "#/components/parameters/HistoryLimit"
      responses:
        "200":
          description: One page of this account's focus history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Sessions]
      operationId: startSession
      summary: Start a focus session
      x-implementation: shipped
      description: >
        Creates the account's single Active session. The server sets
        startTime, endTime, and lastHeartbeatAt. lastHeartbeatAt is the
        first heartbeat. The response does not include a completion token.
        A blank task name is stored as "Focus session". Start is rejected
        while another session is still Active, including one whose presence
        was met and whose scheduled end has passed. A session whose presence
        deadline passed at or before the scheduled end is Abandoned with zero
        rewards before the new session is created.
      security:
        - authCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "201":
          description: The Active session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "400":
          description: |
            The body is not JSON, durationMinutes is not 15, 25, or 50,
            or taskName is not text or is longer than 80 characters.
            Over-limit input is rejected and is never truncated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                duration:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Check the highlighted fields and try again.
                      fields:
                        durationMinutes: Choose 15, 25, or 50 minutes.
                taskName:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Check the highlighted fields and try again.
                      fields:
                        taskName: Task names can be up to 80 characters. This one has 81.
                notJson:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Request body must be valid JSON.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This account already has an Active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: ACTIVE_SESSION_EXISTS
                  message: One session at a time
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sessions/active:
    get:
      tags: [Sessions]
      operationId: getActiveSession
      summary: Get the account's Active session
      x-implementation: shipped
      description: >
        Any authenticated tab of the owner may read the same Active session.
        The server resolves presence before it responds. A session whose
        presence deadline passed at or before the scheduled end is Abandoned
        and is not returned. A session that stayed present through its
        scheduled end stays Active until completion stores the rewards.
        The JSON body is null when the account has no Active session.
        This read does not renew lastHeartbeatAt. No completion token is used.
      security:
        - authCookie: []
      responses:
        "200":
          description: The account's Active session, or null when none is Active.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FocusSession"
                  - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sessions/{id}/heartbeat:
    post:
      tags: [Sessions]
      operationId: heartbeatSession
      summary: Record a heartbeat
      x-implementation: shipped
      description: >
        Any authenticated tab of the owner may send this request. The server
        resolves the session from stored timestamps before it renews
        lastHeartbeatAt. A heartbeat before the presence deadline renews it.
        If that deadline has passed at or before the scheduled end, the session
        is Abandoned and a later heartbeat cannot revive it. A session whose
        presence deadline is strictly after the scheduled end stays Active
        until completion stores the rewards; this endpoint does not mark it
        Completed. An already resolved session returns its stored state. The
        request body is ignored. No completion token is used.
      security:
        - authCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The authoritative session state after resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated account does not own this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: FORBIDDEN
                  message: That session belongs to another account.
        "404":
          description: No session exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: No session exists with that id.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sessions/{id}/complete:
    post:
      tags: [Sessions]
      operationId: completeSession
      summary: Complete a focus session
      x-implementation: shipped
      description: >
        Any authenticated tab of the owner may request completion. The
        server clock is authoritative. Completion before the scheduled end
        is rejected. The session completes only when it was not abandoned
        and its presence deadline is strictly later than the scheduled end.
        Rewards are computed on the server and stored once in the same
        transaction that sets status to COMPLETED.
        A Completed session earns its duration in coins.
        Feeding minutes for that feeding day increase
        by the duration and are capped at 50; minutes past the cap are
        discarded. One apple is credited per 25 feeding minutes on that day,
        at most 2. Leftover minutes stay on the same day. Coins keep accruing
        after Full and are not cleared by the daily reset. The feeding day is
        the session endTime in the user's saved IANA timezone, including when
        resolution happens later. A retry returns the stored rewards and does
        not award them again. The response adds a pet snapshot for that feeding
        day: feedingState and minutesUntilNextApple. An Abandoned session stays
        Abandoned, earns nothing, and cannot be revived. A request body is
        ignored, including any client-supplied coins, feeding minutes, or
        apples. No completion token is used.
      security:
        - authCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: >
            The completed session, including a retry that returns the stored
            rewards, and the pet feeding state after those rewards.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FocusSession"
                  - type: object
                    required: [pet]
                    properties:
                      pet:
                        $ref: "#/components/schemas/SessionPet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated account does not own this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: FORBIDDEN
                  message: That session belongs to another account.
        "404":
          description: No session exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: No session exists with that id.
        "409":
          description: >
            Completion is rejected when the scheduled end has not been
            reached (SESSION_TOO_EARLY) or the session is Abandoned
            (SESSION_ABANDONED). A Completed session is not a conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tooEarly:
                  value:
                    error:
                      code: SESSION_TOO_EARLY
                      message: This session has not reached its scheduled end.
                abandoned:
                  value:
                    error:
                      code: SESSION_ABANDONED
                      message: This session was abandoned and cannot be completed.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/sessions/{id}/abandon:
    post:
      tags: [Sessions]
      operationId: abandonSession
      summary: Give up a focus session
      x-implementation: planned
      security:
        - authCookie: []
      description: |
        Not implemented. No route is registered (issue #17).
        Planned behavior, not a shipped contract: any authenticated tab of
        the owner may give up. Confirming before the scheduled end abandons
        the session. Confirming after the scheduled end, when presence was
        met, completes it. The request and response contract is documented
        when issue #17 merges.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "404":
          description: |
            Not implemented. The server has no abandon route, so this path
            is not found. Missing documentation depends on issue #17.
components:
  securitySchemes:
    authCookie:
      type: apiKey
      in: cookie
      name: onyou_auth
  headers:
    AuthCookie:
      description: |
        `onyou_auth=<JWT>; Path=/; Max-Age=604800; Secure; HttpOnly; SameSite=Lax`.
        The JWT subject is the user id, the `tv` claim is tokenVersion, and
        the token expires after 7 days. The signing secret is not documented.
      schema:
        type: string
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Id of an account-owned focus session.
      schema:
        type: string
    HistoryCursor:
      name: cursor
      in: query
      required: false
      description: Id of the last session returned by the previous page.
      schema:
        type: string
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Page size. History pages contain 20 sessions.
      schema:
        type: integer
        default: 20
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      example: jo@school.edu
    Password:
      type: string
      minLength: 8
      maxLength: 15
      writeOnly: true
      example: sunflower22
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        timezone:
          type: string
          description: IANA timezone from the browser. Falls back to America/Los_Angeles.
          example: America/New_York
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
    User:
      type: object
      required: [id, email, timezone]
      properties:
        id:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        timezone:
          type: string
          example: America/New_York
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    StartSessionRequest:
      type: object
      required: [durationMinutes]
      properties:
        taskName:
          type: string
          maxLength: 80
          description: >
            Optional. Trimmed. Blank becomes "Focus session". A name over 80
            characters is rejected.
        durationMinutes:
          type: integer
          enum: [15, 25, 50]
    FocusSession:
      type: object
      required:
        - id
        - taskName
        - durationMinutes
        - status
        - startTime
        - endTime
        - lastHeartbeatAt
        - coinsEarned
        - feedingMinutesEarned
        - applesEarned
      properties:
        id:
          type: string
        taskName:
          type: string
          example: "Essay draft: intro"
        durationMinutes:
          type: integer
          enum: [15, 25, 50]
        status:
          type: string
          enum: [ACTIVE, COMPLETED, ABANDONED]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
        coinsEarned:
          type: integer
          minimum: 0
          description: >
            Coins stored for this session. Equal to the duration when
            Completed, and 0 while Active or Abandoned.
        feedingMinutesEarned:
          type: integer
          minimum: 0
          description: >
            Feeding minutes stored for this session after the daily cap of 50.
            0 while Active or Abandoned.
        applesEarned:
          type: integer
          minimum: 0
          description: >
            Apples stored for this session. 0 while Active or Abandoned.
    SessionPet:
      type: object
      description: Pet feeding state after a completed session's stored rewards.
      required:
        - name
        - feedingState
        - apples
        - feedingMinutes
        - minutesUntilNextApple
      properties:
        name:
          type: string
          example: Mochi
        feedingState:
          type: string
          enum: [STARVING, HUNGRY, FULL]
        apples:
          type: integer
          minimum: 0
          maximum: 2
        feedingMinutes:
          type: integer
          minimum: 0
          maximum: 50
        minutesUntilNextApple:
          type: integer
          minimum: 0
          maximum: 25
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - EMAIL_IN_USE
                - INVALID_CREDENTIALS
                - UNAUTHENTICATED
                - FORBIDDEN
                - SESSION_NOT_FOUND
                - ACTIVE_SESSION_EXISTS
                - SESSION_TOO_EARLY
                - SESSION_ABANDONED
                - INTERNAL_ERROR
            message:
              type: string
            fields:
              type: object
              description: Per-field messages for form display, keyed by field name.
              additionalProperties:
                type: string
    SessionHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: >
            Focus sessions for the authenticated account, newest first.
            The fields of each session are specified in a later revision.
          items:
            type: object
            additionalProperties: true
            description: One history entry. Field list deferred.
        nextCursor:
          type: [string, "null"]
          description: >
            Session id to send as the cursor query parameter for the next page.
            Null when there is no further page.
  responses:
    ValidationError:
      description: The request body is not JSON or a field is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Check the highlighted fields and try again.
              fields:
                password: Use 8 to 15 characters. This one has 3.
    InternalError:
      description: Unexpected server error. Internal details are never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong. Try again.
    BadRequest:
      description: |
        Shared validation shape. The history sketch uses it. Shipped session
        start documents its own field examples.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The request has no valid onyou_auth cookie.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHENTICATED
              message: Log in to continue.
