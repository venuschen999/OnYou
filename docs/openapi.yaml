openapi: 3.1.0
info:
  title: OnYou API
  version: 0.1.0
  description: |
    OnYou turns focus time into care for a virtual pet (PRD v2.9).
    All bodies are JSON with camelCase fields; timestamps are ISO 8601 UTC.
    Authentication is a JWT in the HttpOnly `onyou_auth` cookie.
    A focus session belongs to the account: any authenticated tab of the
    owner may heartbeat, give up, or request completion. Protected
    operations require that authenticated account. Signup, login, and
    starting a session match the implemented API. Resource field lists for
    the remaining paths are completed in a later revision.
servers:
  - url: /
tags:
  - name: Auth
    description: Account access and password reset.
  - name: Pet
    description: The authenticated account's pet.
  - name: Sessions
    description: Account-owned focus sessions.
paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create an account and its default pet, Mochi
      description: |
        Creates the user and the pet in one transaction and signs the user in.
        The email is trimmed and lowercased. A missing or unknown `timezone`
        is stored as `America/Los_Angeles`. The timezone cannot be changed later.
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AuthCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: An account with this email already exists (case-insensitive).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: EMAIL_IN_USE
                  message: An account with this email already exists.
                  fields:
                    email: An account with this email already exists.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: |
        Matches the email case-insensitively. A wrong email and a wrong
        password return the same 401 response.
      operationId: logIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/AuthCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email or password is incorrect. Check both and try again.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out
      description: >
        Signing out stops heartbeats. Logging out during an Active session
        abandons that session on every device.
      responses:
        "200":
          description: The account is logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset
      description: >
        The response is the same whether or not the email matches an account.
      responses:
        "200":
          description: The reset request was accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Set a new password
      description: >
        A successful reset signs the account out everywhere. It does not
        abandon an Active focus session by itself.
      responses:
        "200":
          description: The password was updated.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/pet:
    get:
      tags: [Pet]
      operationId: getPet
      summary: Get the account pet
      responses:
        "200":
          description: The authenticated account's pet.
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Pet]
      operationId: updatePet
      summary: Rename the account pet
      responses:
        "200":
          description: The updated pet.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List focus history
      description: >
        Returns the authenticated account's Completed and Abandoned sessions,
        newest first, 20 per page.
      parameters:
        - $ref: "#/components/parameters/HistoryCursor"
        - $ref: "#/components/parameters/HistoryLimit"
      responses:
        "200":
          description: One page of this account's focus history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Sessions]
      operationId: startSession
      summary: Start a focus session
      description: >
        Creates the account's single Active session. The server sets
        startTime, endTime, and lastHeartbeatAt. lastHeartbeatAt is the
        first heartbeat. The response does not include a completion token.
        A blank task name is stored as "Focus session". Start is rejected
        while another session is still Active, including one whose presence
        was met and whose scheduled end has passed. A session whose presence
        deadline passed at or before the scheduled end is Abandoned with zero
        rewards before the new session is created.
      security:
        - authCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "201":
          description: The Active session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: This account already has an Active session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: ACTIVE_SESSION_EXISTS
                  message: One session at a time
  /api/sessions/active:
    get:
      tags: [Sessions]
      operationId: getActiveSession
      summary: Get the account's Active session
      description: >
        Any authenticated tab of the owner may read the same Active session.
      responses:
        "200":
          description: The account's Active session.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sessions/{id}/heartbeat:
    post:
      tags: [Sessions]
      operationId: heartbeatSession
      summary: Record a heartbeat
      description: >
        Any authenticated tab of the owner may send this request. The server
        resolves the session from stored timestamps before it renews
        lastHeartbeatAt. A heartbeat before the presence deadline renews it.
        If that deadline has passed at or before the scheduled end, the session
        is Abandoned and a later heartbeat cannot revive it. A session whose
        presence deadline is strictly after the scheduled end stays Active
        until completion stores the rewards; this endpoint does not mark it
        Completed. An already resolved session returns its stored state. The
        request body is ignored. No completion token is used.
      security:
        - authCookie: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The authoritative session state after resolution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The authenticated account does not own this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: FORBIDDEN
                  message: That session belongs to another account.
        "404":
          description: No session exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SESSION_NOT_FOUND
                  message: No session exists with that id.
  /api/sessions/{id}/complete:
    post:
      tags: [Sessions]
      operationId: completeSession
      summary: Complete a focus session
      description: >
        Any authenticated tab of the owner may request completion. Completion
        before the scheduled end is rejected. Rewards are applied once.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session was completed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The session cannot be completed because it is already resolved or
            the scheduled end has not been reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/sessions/{id}/abandon:
    post:
      tags: [Sessions]
      operationId: abandonSession
      summary: Give up a focus session
      description: >
        Any authenticated tab of the owner may give up. Confirming before the
        scheduled end abandons the session. Confirming after the scheduled end,
        when presence was met, completes it.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session was resolved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The session is already resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    authCookie:
      type: apiKey
      in: cookie
      name: onyou_auth
  headers:
    AuthCookie:
      description: |
        `onyou_auth=<JWT>; Path=/; Max-Age=604800; Secure; HttpOnly; SameSite=Lax`.
        The JWT carries the user id and tokenVersion and expires after 7 days.
      schema:
        type: string
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Id of an account-owned focus session.
      schema:
        type: string
    HistoryCursor:
      name: cursor
      in: query
      required: false
      description: Id of the last session returned by the previous page.
      schema:
        type: string
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Page size. History pages contain 20 sessions.
      schema:
        type: integer
        default: 20
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      example: jo@school.edu
    Password:
      type: string
      minLength: 8
      maxLength: 15
      writeOnly: true
      example: sunflower22
    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
        timezone:
          type: string
          description: IANA timezone from the browser. Falls back to America/Los_Angeles.
          example: America/New_York
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
    User:
      type: object
      required: [id, email, timezone]
      properties:
        id:
          type: string
        email:
          $ref: "#/components/schemas/Email"
        timezone:
          type: string
          example: America/New_York
    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    StartSessionRequest:
      type: object
      required: [durationMinutes]
      properties:
        taskName:
          type: string
          maxLength: 80
          description: >
            Optional. Trimmed. Blank becomes "Focus session". A name over 80
            characters is rejected.
        durationMinutes:
          type: integer
          enum: [15, 25, 50]
    FocusSession:
      type: object
      required:
        - id
        - taskName
        - durationMinutes
        - status
        - startTime
        - endTime
        - lastHeartbeatAt
        - coinsEarned
        - feedingMinutesEarned
        - applesEarned
      properties:
        id:
          type: string
        taskName:
          type: string
          example: Essay draft: intro
        durationMinutes:
          type: integer
          enum: [15, 25, 50]
        status:
          type: string
          enum: [ACTIVE, COMPLETED, ABANDONED]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
        coinsEarned:
          type: integer
        feedingMinutesEarned:
          type: integer
        applesEarned:
          type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - EMAIL_IN_USE
                - INVALID_CREDENTIALS
                - UNAUTHENTICATED
                - FORBIDDEN
                - SESSION_NOT_FOUND
                - ACTIVE_SESSION_EXISTS
                - INTERNAL_ERROR
            message:
              type: string
            fields:
              type: object
              description: Per-field messages for form display, keyed by field name.
              additionalProperties:
                type: string
    SessionHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: >
            Focus sessions for the authenticated account, newest first.
            The fields of each session are specified in a later revision.
          items:
            type: object
            additionalProperties: true
            description: One history entry. Field list deferred.
        nextCursor:
          type: [string, "null"]
          description: >
            Session id to send as the cursor query parameter for the next page.
            Null when there is no further page.
  responses:
    ValidationError:
      description: The request body is not JSON or a field is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Check the highlighted fields and try again.
              fields:
                password: Use 8 to 15 characters. This one has 3.
    InternalError:
      description: Unexpected server error. Internal details are never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: The request is not authenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated account does not own this session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: No session exists with this id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Password-reset requests are rate limited.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
