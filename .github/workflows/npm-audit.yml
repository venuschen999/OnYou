# Issue #4: fail this check when npm reports a high or critical vulnerability.
# The lockfile comes from the app scaffold. This workflow does not create one.

name: npm audit

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
