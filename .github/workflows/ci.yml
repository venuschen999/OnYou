# Issue #2: lint, typecheck, unit tests, coverage, and integration tests.
# A failed step fails its job. GitHub reports that failed job as a failing check.
#
# Coverage (AGENTS.md §6) is `npm run test:coverage`:
# overall lines must be at least 80%. When src/lib/domain/ has runtime source,
# lines and branches must be at least 95%. With no runtime source, domain
# coverage is reported as N/A and is not treated as 100%.

name: CI

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage
        run: npm run test:coverage

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        # Ephemeral service credentials for this job only. Not an application secret.
        env:
          POSTGRES_USER: onyou
          POSTGRES_PASSWORD: onyou
          POSTGRES_DB: onyou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyou -d onyou_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This job's Postgres service only. Never the production Neon database.
      TEST_DATABASE_URL: postgresql://onyou:onyou@localhost:5432/onyou_test
      DATABASE_URL: postgresql://onyou:onyou@localhost:5432/onyou_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
