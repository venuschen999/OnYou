# Issue #2: lint, typecheck, unit tests, coverage, and integration tests.
# Issue #6: Playwright E2E smoke tests against a production build.
# A failed step fails its job. GitHub reports that failed job as a failing check.
#
# Coverage (AGENTS.md §6) is `npm run test:coverage`:
# overall lines must be at least 80%. When src/lib/domain/ has runtime source,
# lines and branches must be at least 95%. With no runtime source, domain
# coverage is reported as N/A and is not treated as 100%.

name: CI

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage
        run: npm run test:coverage

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        # Ephemeral service credentials for this job only. Not an application secret.
        env:
          POSTGRES_USER: onyou
          POSTGRES_PASSWORD: onyou
          POSTGRES_DB: onyou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyou -d onyou_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This job's Postgres service only. Never the production Neon database.
      TEST_DATABASE_URL: postgresql://onyou:onyou@localhost:5432/onyou_test
      DATABASE_URL: postgresql://onyou:onyou@localhost:5432/onyou_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        # Ephemeral service credentials for this job only. Not an application secret.
        env:
          POSTGRES_USER: onyou
          POSTGRES_PASSWORD: onyou
          POSTGRES_DB: onyou_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyou -d onyou_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # This job's Postgres service only. Never the production Neon database.
      DATABASE_URL: postgresql://onyou:onyou@localhost:5432/onyou_e2e
      # Signs cookies for this throwaway run only; not a deployment secret.
      JWT_SECRET: e2e-only-signing-key-for-ci-runs-0123456789
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
