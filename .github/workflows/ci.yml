# Issue #2: lint, typecheck, unit tests, and integration tests on pull requests.
# A failed step fails the job. GitHub reports that failed job as a failing check.
#
# Coverage is not enforced here yet. AGENTS.md requires CI to fail when
# src/lib/domain/ is below 95% lines and branches, or overall lines are below 80%.
# That gate is `npm run test:coverage` once the scaffold and Vitest config exist.
# Do not close Issue #2 without resolving that gap.

name: CI

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onyou
          POSTGRES_PASSWORD: onyou
          POSTGRES_DB: onyou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyou -d onyou_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://onyou:onyou@localhost:5432/onyou_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration
